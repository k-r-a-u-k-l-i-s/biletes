name: Atjaunot biļešu datus

on:
  schedule:
    - cron: "*/15 * * * *"   # ik pēc 15 min (GitHub var aizkavēt par dažām minūtēm)
  workflow_dispatch:          # palaišana ar roku
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Iegūt datus no API
        run: node build-data.mjs

      - name: Saglabāt izmaiņas
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Izmaiņu nav."
          else
            git commit -m "Atjaunoti biļešu dati"
            git push
          fi
